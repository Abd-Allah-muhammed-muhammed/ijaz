name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e

            cd /home/ijaz/project

            # 1. Pull latest
            git fetch origin main
            git reset --hard origin/main

            # 2. Remove sensitive docs — never leave on server
            # All project docs (including PROJECT_CONTEXT, API_INVENTORY, etc.) live under docs/
            rm -rf docs/

            # 3. PHP dependencies
            composer install --no-dev --optimize-autoloader --no-interaction

            # 4. Frontend build
            # Wayfinder actions are gitignored and NOT generated during `vite build`
            # (vite-plugin-run has build:false). `npm run build` → `prebuild` regenerates
            # them; run explicitly here too so a missing prebuild never ships stale actions
            # (e.g. missing `.typing` → "G.typing is not a function" on chat pages).
            #
            # VITE_REVERB_* are BUILD-TIME: Vite inlines them from this server's `.env`
            # during `npm run build`. Runtime PHP `.env` alone does not fix an old bundle.
            # Production (Cloudflare): VITE_REVERB_HOST=ijaz.sa, VITE_REVERB_PORT=8443,
            # VITE_REVERB_SCHEME=wss — NOT 8080 (Cloudflare drops WS upgrades on 8080).
            # Internal REVERB_SERVER_PORT/REVERB_PORT (e.g. 6002) stay unchanged.
            # Rebuild after any Reverb / VITE_REVERB_* env change.
            php artisan wayfinder:generate --no-interaction
            npm ci --prefer-offline
            npm run build

            # 5. Migrations
            php artisan migrate --force

            # 6. Cache
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan event:cache

            echo "Deployed successfully"
